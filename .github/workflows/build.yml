name: Build tonyenc for PHP 7.4

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "7.4"
            arch: x64
            ts: nts
            os: windows-2019
          - php-version: "7.4"
            arch: x64
            ts: ts
            os: windows-2019
          - php-version: "7.4"
            arch: x86
            ts: nts
            os: windows-2019
          - php-version: "7.4"
            arch: x86
            ts: ts
            os: windows-2019

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}

      - name: Show built files
        shell: pwsh
        run: Get-ChildItem -Path . -Recurse -Filter php_tonyenc.dll | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_tonyenc-${{ matrix.php-version }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: |
            **/php_tonyenc.dll
          if-no-files-found: error